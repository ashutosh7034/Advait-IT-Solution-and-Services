      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p2Grad)"/>
  <g transform="translate(40, 35)">

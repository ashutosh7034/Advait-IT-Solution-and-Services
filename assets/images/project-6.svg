    <text x="260" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#BAE6FD" text-anchor="middle">fleetflow-map.telematics/live</text>

    <!-- Map Route View -->
    <rect x="25" y="52" width="310" height="230" rx="8" fill="#075985" stroke="#0284C7"/>

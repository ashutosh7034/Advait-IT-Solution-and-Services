<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="p6Grad" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p6Grad)"/>
  <g transform="translate(40, 35)">
    <rect width="520" height="310" rx="12" fill="#0F172A" stroke="#0369A1" stroke-width="1.5"/>

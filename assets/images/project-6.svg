    <line x1="120" y1="52" x2="120" y2="282" stroke="#0369A1" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="220" y1="52" x2="220" y2="282" stroke="#0369A1" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Route Line -->
